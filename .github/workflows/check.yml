name: Check skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Test scaffold and audit helpers
        run: python3 -B scripts/test_scripts.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.9.0'
      - name: Build and exercise the checked Host starter
        env:
          DSH_SMOKE_DIR: ${{ runner.temp }}/dsh-plugin-check
        run: |
          set -euo pipefail
          python3 scripts/scaffold_plugin.py "$DSH_SMOKE_DIR" \
            --package-name dsh-plugin-ci-check \
            --dsh-version 0.2.2-rc.1 --cordis-version 4.1.0
          npm install --prefix "$DSH_SMOKE_DIR" --ignore-scripts --no-audit --no-fund
          npm run check --prefix "$DSH_SMOKE_DIR"
          python3 scripts/audit_plugin.py "$DSH_SMOKE_DIR" --dsh-version 0.2.2-rc.1 --require-built
          npm pack --prefix "$DSH_SMOKE_DIR" --dry-run "$DSH_SMOKE_DIR"
      - name: Scan public files and Git history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d)
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz \
            --pattern gitleaks_8.30.1_checksums.txt --dir "$scan_dir"
          (
            cd "$scan_dir"
            grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
            tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          )
          "$scan_dir/gitleaks" dir . --redact --no-banner
          "$scan_dir/gitleaks" git . --log-opts=--all --redact --no-banner
